name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - tsconfig.json

# Publishes to GitHub Packages (npm.pkg.github.com) — this is what lets
# korridor-api/korridor-web resolve @korridor-finance/shared-types as a real
# versioned dependency instead of a `link:../korridor-shared-types` path that
# only works when both repos happen to sit side-by-side on disk (local dev
# only; a Docker build or a PaaS deploy of just korridor-api has no such
# sibling checkout).
#
# Publishing from this repo's own CI needs no manual secret — the ambient
# GITHUB_TOKEN can publish packages owned by the SAME repository once granted
# `packages: write` below. Consuming this package from korridor-api's or
# korridor-web's CI (a DIFFERENT repo) is a separate story — see
# docs/PUBLISHING.md for the PAT those repos need.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@korridor-finance'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Guards against a failed/red CI run on every unrelated push to main —
      # only actually publishes when package.json's version is new.
      - name: Check whether this version is already published
        id: version_check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @korridor-finance/shared-types version --registry=https://npm.pkg.github.com 2>/dev/null || echo "none")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
